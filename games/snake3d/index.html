<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D 贪吃蛇</title>
  <link rel="icon" href="assets/icons/icon_snake.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- Three.js 渲染容器 -->
  <div id="game-container"></div>

  <!-- 顶部左侧导航操作栏 -->
  <div class="top-nav-bar">
    <a href="../../" class="nav-pill-btn" title="返回游戏大厅"><img src="assets/icons/icon_home.png" alt="大厅" class="ui-icon"> <span class="nav-btn-text">大厅</span></a>
    <button id="btn-top-leaderboard" class="nav-pill-btn" title="查看风云榜"><img src="assets/icons/icon_trophy.png" alt="风云榜" class="ui-icon"> <span class="nav-btn-text">风云榜</span></button>
    <button id="btn-top-shop" class="nav-pill-btn btn-nav-extra" title="装扮商城"><img src="assets/icons/icon_wardrobe.png" alt="装扮" class="ui-icon"> <span class="nav-btn-text">装扮</span></button>
    <button id="btn-top-achievements" class="nav-pill-btn btn-nav-extra" title="荣誉成就"><img src="assets/icons/icon_crown.png" alt="成就" class="ui-icon"> <span class="nav-btn-text">成就</span></button>
    <div id="rotate-hint" class="rotate-hint-pill" title="旋转手机体验横屏掌机模式">
      <img src="assets/icons/icon_gamepad.png" alt="横屏" class="ui-icon">
      <span class="rotate-hint-text">横屏更佳</span>
    </div>
  </div>

  <!-- HUD：顶部状态栏 (中文版) -->
  <div id="hud" class="hud-container hidden">
    <div class="hud-group hud-left">
      <div class="hud-item">
        <span class="hud-label">得分</span>
        <span class="hud-value highlight" id="hud-score">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">最高</span>
        <span class="hud-value" id="hud-highscore">0</span>
      </div>
    </div>
    <div class="hud-group hud-right">
      <div class="hud-item">
        <span class="hud-label">长度</span>
        <span class="hud-value" id="hud-length">1</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">等级</span>
        <span class="hud-badge" id="hud-level">1级</span>
      </div>
    </div>
  </div>

  <!-- 局内顶部天气状态胶囊 (微光 3D 粘土图标) -->
  <div id="weather-hud" class="weather-pill hidden">
    <img id="weather-icon" src="assets/icons/icon_weather_sun.png" alt="天气" class="weather-icon-img">
    <span id="weather-name" class="weather-name-text">晴空暖阳</span>
  </div>

  <!-- 局内变天全屏广播横幅飘条 -->
  <div id="weather-banner" class="weather-banner hidden">
    <img id="weather-banner-icon" src="assets/icons/icon_weather_thunder.png" alt="天气" class="weather-banner-icon-img">
    <span id="weather-banner-text" class="weather-banner-text">天气变幻：暴雨惊雷来袭！</span>
  </div>

  <!-- 局内动态道具状态胶囊 (5秒倒计时纯中文反馈) -->
  <div id="powerup-hud" class="powerup-pill hidden">
    <img id="powerup-icon" src="assets/icons/icon_magnet.png" alt="道具" class="powerup-icon-img">
    <span id="powerup-name" class="powerup-name-text">磁力吸附</span>
    <span id="powerup-timer" class="powerup-timer-badge">5.0秒</span>
  </div>

  <!-- Combo 显示：顶部居中 -->
  <div id="combo" class="hidden">连击 x2!</div>

  <!-- 开始画面 -->
  <div id="start-screen" class="overlay">
    <div class="overlay-content toy-card">
      <img src="assets/ui/snake3d_start_badge.png" alt="3D贪吃蛇" class="modal-badge-img">
      <p class="subtitle">趣味 3D 清新乐园版</p>
      
      <!-- 玩法模式选择器 -->
      <div class="mode-select-wrap">
        <div class="mode-pill-group">
          <button id="mode-btn-classic" class="mode-tab-btn active" type="button">
            <img src="assets/icons/icon_snake.png" alt="经典" class="ui-icon"> 经典模式
          </button>
          <button id="mode-btn-crazy" class="mode-tab-btn" type="button">
            <img src="assets/icons/icon_boost.png" alt="疯狂" class="ui-icon"> 疯狂道具
          </button>
        </div>
        <div id="mode-desc" class="mode-desc-text">经典纯粹规则 · 吃食物成长与避障</div>
      </div>

      <div class="hint-pill">方向键 / 虚拟摇杆 / 滑动 控制转向</div>
      <div class="start-btn-group">
        <button id="start-btn" class="toy-btn toy-btn-primary"><img src="assets/icons/icon_rocket.png" alt="开始" class="ui-icon-btn"> 开始游戏 (空格 / 轻触)</button>
        <div class="start-sub-btn-row">
          <button id="btn-start-shop" class="toy-btn toy-btn-secondary"><img src="assets/icons/icon_wardrobe.png" alt="装扮" class="ui-icon-btn"> 装扮商城</button>
          <button id="btn-start-achievements" class="toy-btn toy-btn-secondary"><img src="assets/icons/icon_crown.png" alt="成就" class="ui-icon-btn"> 荣誉成就</button>
          <button id="btn-start-leaderboard" class="toy-btn toy-btn-secondary"><img src="assets/icons/icon_trophy.png" alt="风云榜" class="ui-icon-btn"> 风云榜</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Over 画面 -->
  <div id="gameover-screen" class="overlay hidden">
    <div class="overlay-content toy-card">
      <img src="assets/ui/snake3d_gameover_badge.png" alt="游戏结束" class="modal-badge-img">
      <div class="reason-pill">
        <span class="reason-icon"><img src="assets/icons/icon_collision.png" alt="碰撞" class="ui-icon"></span>
        <span id="gameover-reason" class="gameover-reason-text">撞到障碍物</span>
      </div>
      <div class="score-card">
        <div class="score-label">最终得分</div>
        <div class="score-number" id="gameover-score">0</div>
        <div class="score-reward-row" id="gameover-reward-row">
          <span class="coin-gain-badge"><img src="assets/icons/icon_coin.png" alt="金币" class="ui-icon"> +<span id="gameover-coin-gain">0</span> 金币</span>
          <span class="coin-total-badge">金币余额: <span id="gameover-coin-total">0</span></span>
        </div>
        <div class="score-percentile" id="gameover-percentile">正在计算排名...</div>
      </div>
      <div class="gameover-btn-group">
        <button id="restart-btn" class="toy-btn toy-btn-primary"><img src="assets/icons/icon_refresh.png" alt="重玩" class="ui-icon-btn"> 重新开始 (R / 空格 / 轻触)</button>
        <div class="gameover-btn-row">
          <button id="btn-gameover-shop" class="toy-btn toy-btn-secondary"><img src="assets/icons/icon_wardrobe.png" alt="装扮" class="ui-icon-btn"> 装扮</button>
          <button id="btn-gameover-achievements" class="toy-btn toy-btn-secondary"><img src="assets/icons/icon_crown.png" alt="成就" class="ui-icon-btn"> 成就</button>
          <button id="btn-gameover-poster" class="toy-btn toy-btn-secondary"><img src="assets/icons/icon_share.png" alt="战报" class="ui-icon-btn"> 战报</button>
          <button id="btn-gameover-challenge" class="toy-btn toy-btn-secondary"><img src="assets/icons/icon_rocket.png" alt="挑战" class="ui-icon-btn"> 挑战</button>
          <button id="btn-gameover-leaderboard" class="toy-btn toy-btn-secondary"><img src="assets/icons/icon_trophy.png" alt="风云榜" class="ui-icon-btn"> 风云榜</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 浮动得分容器 -->
  <div id="floating-scores"></div>

  <!-- 移动端双拇指掌机触控容器 (左摇杆 + 右冲刺) -->
  <div id="touch-controls" class="touch-controls hidden">
    <div id="virtual-stick" class="virtual-stick">
      <div class="stick-knob" id="stick-knob"></div>
    </div>
    <button id="touch-boost-btn" class="touch-boost-btn" type="button" aria-label="按住极速冲刺">
      <img src="assets/icons/icon_boost.png" alt="冲刺" class="boost-icon-img">
      <span class="boost-btn-text">冲刺</span>
    </button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
