<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🐍 3D 贪吃蛇</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- Three.js 渲染容器 -->
  <div id="game-container"></div>

  <!-- 返回游戏大厅 -->
  <a href="../../" class="back-home-btn" title="返回游戏大厅">🏠 游戏大厅</a>

  <!-- HUD：顶部状态栏 -->
  <div id="hud" class="hud-container hidden">
    <div class="hud-group hud-left">
      <div class="hud-item">
        <span class="hud-label">SCORE</span>
        <span class="hud-value highlight" id="hud-score">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">BEST</span>
        <span class="hud-value" id="hud-highscore">0</span>
      </div>
    </div>
    <div class="hud-group hud-right">
      <div class="hud-item">
        <span class="hud-label">LENGTH</span>
        <span class="hud-value" id="hud-length">1</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">LEVEL</span>
        <span class="hud-badge" id="hud-level">Lv.1</span>
      </div>
    </div>
  </div>

  <!-- Combo 显示：顶部居中 -->
  <div id="combo" class="hidden">COMBO x2!</div>

  <!-- 开始画面 -->
  <div id="start-screen" class="overlay">
    <div class="overlay-content toy-card">
      <img src="assets/ui/snake3d_start_badge.png" alt="SNAKE 3D" class="modal-badge-img">
      <p class="subtitle">趣味 3D 清新乐园版</p>
      <div class="hint-pill">方向键 / WASD / 摇杆 控制转向</div>
      <button id="start-btn" class="toy-btn toy-btn-primary">🚀 开始游戏 (空格 / 轻触)</button>
    </div>
  </div>

  <!-- Game Over 画面 -->
  <div id="gameover-screen" class="overlay hidden">
    <div class="overlay-content toy-card">
      <img src="assets/ui/snake3d_gameover_badge.png" alt="GAME OVER" class="modal-badge-img">
      <div class="reason-pill">
        <span class="reason-icon">💥</span>
        <span id="gameover-reason" class="gameover-reason-text">撞到障碍物</span>
      </div>
      <div class="score-card">
        <div class="score-label">最终得分</div>
        <div class="score-number" id="gameover-score">0</div>
      </div>
      <button id="restart-btn" class="toy-btn toy-btn-primary">🔄 重新开始 (R / 空格 / 轻触)</button>
    </div>
  </div>

  <!-- 浮动得分容器 -->
  <div id="floating-scores"></div>

  <!-- 移动端 360° 弹性虚拟摇杆 -->
  <div id="touch-controls" class="touch-controls hidden">
    <div id="virtual-stick" class="virtual-stick">
      <div class="stick-knob" id="stick-knob"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
